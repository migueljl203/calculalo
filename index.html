<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalculaYa</title>
<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:40px;
text-align:center;
}

.card{
background:white;
padding:30px;
border-radius:15px;
max-width:500px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

input{
padding:10px;
width:80%;
margin:10px;
}

button{
padding:10px 20px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
}

#resultado{
margin-top:20px;
font-size:22px;
font-weight:bold;
}
</style>
</head>
<body>

<div class="card">
<h1>CalculaYa</h1>

<h3>Calculadora de Porcentajes</h3>

<input type="number" id="numero" placeholder="Número">

<input type="number" id="porcentaje" placeholder="%">

<br>

<button onclick="calcular()">Calcular</button>

<div id="resultado"></div>

</div>

<script>
function calcular(){

let numero =
Number(document.getElementById("numero").value);

let porcentaje =
Number(document.getElementById("porcentaje").value);

let resultado =
(numero * porcentaje) / 100;

document.getElementById("resultado").innerHTML =
resultado;

}
</script>

</body>
</html>
